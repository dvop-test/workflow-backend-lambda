---
name: Backend Lambda Feature CI (Soft GitFlow)

on:
  workflow_call:
    inputs:
      service_name:
        required: true
        type: string
      node_version:
        required: false
        default: "18"
        type: string
      aws_region:
        required: false
        default: "us-east-1"
        type: string
    # secrets:
    #   AWS_ROLE_ARN:
    #     required: true

env:
  STAGE: feature
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:

  build:
    name: Build
    runs-on: ubuntu-latest

    outputs:
      artifact-name: ${{ steps.artifact.outputs.name }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Install dependencies
        run: ls


