---
name: Backend Lambda Feature CI (Soft GitFlow)

on:
  workflow_call:
    inputs:
      service_name:
        required: true
        type: string
      node_version:
        required: false
        default: "18"
        type: string
      aws_region:
        required: false
        default: "us-east-1"
        type: string
    # secrets:
    #   AWS_ROLE_ARN:
    #     required: true

env:
  STAGE: feature
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:


  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: npm install && npm test
      
  build:
    name: Build And Package
    runs-on: ubuntu-latest
    outputs:
      artifact-name: ${{ steps.upload_lambda_zip.outputs.artifact-id }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v5

      - name: Checkout CI/CD Core Logic
        uses: actions/checkout@v5
        with:
          repository: dvop-test/workflow-backend-lambda
          path: workflow-core

      - name: Setup Environment
        uses: dvop-test/workflow-backend-lambda/actions/setup-environment@master

      - name: Setup Runtime
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: './app/package-lock.json'

      - name: Install Dependencies
        working-directory: ./app
        run: npm install

      - name: Build Application
        working-directory: ./app
        run: npm run build

      - name: Package Lambda
        id: package_step 
        uses: dvop-test/workflow-backend-lambda/actions/build-lambda@master

      - name: Upload Artifact
        if: success()
        id: upload_lambda_zip
        uses: actions/upload-artifact@v5
        with:
          name: ${{ env.PROJECT_NAME }}-${{ env.APP_ENV }}
          path: ${{ steps.package_step.outputs.zip_path }}
          retention-days: 1